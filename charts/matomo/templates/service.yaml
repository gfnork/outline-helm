apiVersion: v1
kind: Service
metadata:
  name: {{ include "matomo.fullname" . }}
  labels:
    {{- include "matomo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
  selector:
    {{- include "matomo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
