name: Validate RoadAtlas chart

on:
  pull_request:
    paths:
      - charts/roadatlas/**
      - scripts/check-roadatlas-chart.py
      - .github/workflows/roadatlas-ci.yml
  push:
    branches: [master]
    paths:
      - charts/roadatlas/**
      - scripts/check-roadatlas-chart.py
      - .github/workflows/roadatlas-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint --strict charts/roadatlas -f charts/roadatlas/ci/microk8s-values.yaml
      - run: python scripts/check-roadatlas-chart.py
      - run: helm package charts/roadatlas --destination /tmp/chart-packages

