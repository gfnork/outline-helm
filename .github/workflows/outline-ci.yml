name: Validate Outline chart

on:
  pull_request:
    paths:
      - charts/outline/**
      - scripts/check-outline-chart.py
      - .github/workflows/outline-ci.yml
  push:
    branches: [master]
    paths:
      - charts/outline/**
      - scripts/check-outline-chart.py
      - .github/workflows/outline-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint --strict charts/outline
      - run: python scripts/check-outline-chart.py
      - run: helm package charts/outline --destination /tmp/chart-packages
